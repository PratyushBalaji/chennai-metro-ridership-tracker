name: Daily Data Update

on:
  schedule:
    - cron: "0 4 * * *"    # 09:30 IST, today live
    - cron: "0 8 * * *"    # 13:30 IST, today live
    - cron: "0 13 * * *"   # 18:30 IST, today live
    - cron: "45 17 * * *"  # 23:15 IST, today live
    - cron: "45 20 * * *"  # 02:15 IST, yesterday final
  workflow_dispatch:
    inputs:
      day:
        description: "CMRL day selector"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write

concurrency:
  group: data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set branch
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set day
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAY_SELECTOR="${{ github.event.inputs.day }}"
          elif [ "${{ github.event.schedule }}" = "45 20 * * *" ]; then
            DAY_SELECTOR="1"
          else
            DAY_SELECTOR="0"
          fi
          echo "DAY_SELECTOR=$DAY_SELECTOR" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install reqs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ridership
        id: ridership
        continue-on-error: true
        run: |
          set +e
          python ridership.py --day "$DAY_SELECTOR" --strict --anomaly-log Discrepancies/anomaly_log.jsonl
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit anomaly log
        if: steps.ridership.outputs.exit_code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Discrepancies/
          git diff --cached --quiet || git commit -m "log ridership anomaly"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"
          exit 1

      - name: Fail on ridership error
        if: steps.ridership.outputs.exit_code != '0' && steps.ridership.outputs.exit_code != '2'
        run: exit 1

      - name: Read dataset date
        if: steps.ridership.outputs.exit_code == '0'
        shell: bash
        run: |
          API_DATE=$(tail -n 1 Ridership/ChennaiMetro_Hourly_Ridership.csv | awk -F',' '{print $1}')
          echo "DATASET_DATE=$API_DATE" >> "$GITHUB_ENV"

      - name: Commit ridership changes
        if: steps.ridership.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ridership/
          git diff --cached --quiet || git commit -m "update ridership $DATASET_DATE"

      - name: Run parking
        if: env.DAY_SELECTOR == '1' && steps.ridership.outputs.exit_code == '0'
        run: python parking.py

      - name: Commit parking changes
        if: env.DAY_SELECTOR == '1' && steps.ridership.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Parking/
          git diff --cached --quiet || git commit -m "update parking $DATASET_DATE"

      - name: Push changes
        if: steps.ridership.outputs.exit_code == '0'
        run: |
          git pull --rebase origin "$BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"
