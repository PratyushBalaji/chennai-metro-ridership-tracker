name: Daily Data Update

on:
  schedule:
    - cron: "0 4 * * *"    # 09:30 IST, today live
    - cron: "0 8 * * *"    # 13:30 IST, today live
    - cron: "0 13 * * *"   # 18:30 IST, today live
    - cron: "45 17 * * *"  # 23:15 IST, today live
    - cron: "45 20 * * *"  # 02:15 IST, yesterday final
  workflow_dispatch:
    inputs:
      day:
        description: "CMRL day selector"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write

concurrency:
  group: data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Set branch and day
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DAY: ${{ inputs.day }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DAY_SELECTOR="$INPUT_DAY"
          elif [ "$SCHEDULE" = "45 20 * * *" ]; then
            DAY_SELECTOR="1"
          else
            DAY_SELECTOR="0"
          fi
          echo "DAY_SELECTOR=$DAY_SELECTOR" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install reqs
        run: python -m pip install .
      - name: Run ridership
        id: ridership
        run: |
          set +e
          python -m collector.ridership --day "$DAY_SELECTOR"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Run parking
        id: parking
        if: env.DAY_SELECTOR == '1' && steps.ridership.outputs.exit_code == '0'
        run: |
          set +e
          python -m collector.parking
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit and push data
        if: (steps.ridership.outputs.exit_code == '0' || steps.ridership.outputs.exit_code == '2') && (steps.parking.outputs.exit_code == '' || steps.parking.outputs.exit_code == '0' || steps.parking.outputs.exit_code == '2')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ridership/ data/parking/
          if [ -d data/discrepancies ]; then git add data/discrepancies/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): update daily data"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"
      - name: Report collection result
        env:
          EXIT_CODE: ${{ steps.ridership.outputs.exit_code != '0' && steps.ridership.outputs.exit_code || steps.parking.outputs.exit_code || '0' }}
        run: exit "$EXIT_CODE"
