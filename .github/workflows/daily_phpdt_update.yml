name: Daily PHPDT Update

on:
  schedule:
    - cron: '30 1 * * *' # 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Set branch
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install reqs
        run: python -m pip install .
      - name: Run PHPDT
        id: phpdt
        run: |
          set +e
          python -m collector.phpdt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit and push data
        if: steps.phpdt.outputs.exit_code == '0' || steps.phpdt.outputs.exit_code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/phpdt/
          if [ -d data/discrepancies ]; then git add data/discrepancies/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): update phpdt"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"
      - name: Report collection result
        env:
          EXIT_CODE: ${{ steps.phpdt.outputs.exit_code }}
        run: exit "$EXIT_CODE"
