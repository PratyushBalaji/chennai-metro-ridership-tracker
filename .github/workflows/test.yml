name: Collector Tests

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install reqs in tests
        run: python -m pip install -e ".[test]"
      - name: Run ridership with fixed API response
        run: >-
          python -m collector.ridership
          --api-response tests/fixtures/api/consistent_ridership.json
          --output-dir "$RUNNER_TEMP/ridership-cli"
      - name: Run parking with fixed API response
        run: >-
          python -m collector.parking
          --api-response tests/fixtures/api/day1.json
          --output-dir "$RUNNER_TEMP/parking-cli"
      - name: Run PHPDT with fixed API response
        run: >-
          python -m collector.phpdt
          --api-response tests/fixtures/api/day1.json
          --output-dir "$RUNNER_TEMP/phpdt-cli"
      - name: Run collector tests
        run: >-
          python -m pytest
          --cov=collector --cov-report=term-missing --cov-report=xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-test-results
          path: |
            .cache/reports/junit.xml
            .cache/reports/coverage.xml
            ${{ runner.temp }}/ridership-cli/ridership/*.csv
            ${{ runner.temp }}/parking-cli/parking/*.csv
            ${{ runner.temp }}/phpdt-cli/phpdt/*.csv
