name: Ridership Anomaly Retry

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Set branch
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install reqs
        run: python -m pip install .
      - name: Run retry
        id: ridership
        run: |
          set +e
          python -m collector.ridership --retry
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit and push data
        if: steps.ridership.outputs.exit_code == '0' || steps.ridership.outputs.exit_code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ridership/
          if [ -d data/discrepancies ]; then git add data/discrepancies/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): retry ridership"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"
      - name: Report retry result
        env:
          EXIT_CODE: ${{ steps.ridership.outputs.exit_code }}
        run: exit "$EXIT_CODE"
