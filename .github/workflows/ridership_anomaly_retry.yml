name: Ridership Anomaly Retry

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ridership-anomaly-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install reqs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check retry
        id: retry
        run: python scripts/anomaly_retry_due.py --log Discrepancies/anomaly_log.jsonl --wait-minutes 15 --cutoff-ist 23:50

      - name: Mark retry expired
        if: steps.retry.outputs.expired == 'true'
        run: |
          python scripts/append_anomaly_status.py --log Discrepancies/anomaly_log.jsonl --status expired --reason retry_cutoff
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Discrepancies/
          git diff --cached --quiet || git commit -m "expire ridership retry"
          git pull --rebase origin main
          git push
          exit 1

      - name: Run retry
        if: steps.retry.outputs.should_retry == 'true'
        id: ridership
        continue-on-error: true
        run: |
          python ridership.py --day 0 --strict --anomaly-log Discrepancies/anomaly_log.jsonl
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mark retry resolved
        if: steps.retry.outputs.should_retry == 'true' && steps.ridership.outputs.exit_code == '0'
        run: python scripts/append_anomaly_status.py --log Discrepancies/anomaly_log.jsonl --status resolved --reason retry_ok

      - name: Read dataset date
        if: steps.retry.outputs.should_retry == 'true' && steps.ridership.outputs.exit_code == '0'
        shell: bash
        run: |
          API_DATE=$(tail -n 1 Ridership/ChennaiMetro_Hourly_Ridership.csv | awk -F',' '{print $1}')
          echo "DATASET_DATE=$API_DATE" >> "$GITHUB_ENV"

      - name: Commit resolved retry
        if: steps.retry.outputs.should_retry == 'true' && steps.ridership.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ridership/ Discrepancies/
          git diff --cached --quiet || git commit -m "retry ridership $DATASET_DATE"
          git pull --rebase origin main
          git push

      - name: Commit retry anomaly
        if: steps.retry.outputs.should_retry == 'true' && steps.ridership.outputs.exit_code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Discrepancies/
          git diff --cached --quiet || git commit -m "log ridership retry anomaly"
          git pull --rebase origin main
          git push
          exit 1

      - name: Fail on retry error
        if: steps.retry.outputs.should_retry == 'true' && steps.ridership.outputs.exit_code != '0' && steps.ridership.outputs.exit_code != '2'
        run: exit 1
